<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Source node -->
  <rect x="1" y="12" width="7" height="8" rx="1.5" fill="#3b82f6"/>
  <!-- Fork: top node -->
  <rect x="13" y="5" width="7" height="7" rx="1.5" fill="#3b82f6"/>
  <!-- Fork: bottom node -->
  <rect x="13" y="20" width="7" height="7" rx="1.5" fill="#3b82f6"/>
  <!-- Sink node -->
  <rect x="24" y="12" width="7" height="8" rx="1.5" fill="#3b82f6"/>
  <!-- Source -> top -->
  <line x1="8" y1="14" x2="13" y2="8.5" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Source -> bottom -->
  <line x1="8" y1="18" x2="13" y2="23.5" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top -> sink -->
  <line x1="20" y1="8.5" x2="24" y2="14" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom -> sink -->
  <line x1="20" y1="23.5" x2="24" y2="18" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
</svg>
