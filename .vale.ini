# Vale — prose style linter (https://vale.sh).
# Enforces the anti-patterns from .claude/skills/documentation/SKILL.md
# and root CLAUDE.md Principle #25 (Clear / Concise / Structured).
#
# Runs in CI via errata-ai/vale-action. To run locally:
#   vale docs/
#   vale docs/features/DSL.md

StylesPath = .vale/styles
MinAlertLevel = warning

[formats]
md = md

[*.md]
BasedOnStyles = PolyrisDocs

# Historical / frozen docs — same exclusion list as tests/docs/_helpers.py
# and lychee.toml. Allowed to keep whatever prose they had at write time.
[docs/reference/DESIGN_DECISIONS.md]
BasedOnStyles =

[docs/reference/adr-*.md]
BasedOnStyles =

[docs/reference/SPIKE_*.md]
BasedOnStyles =

[docs/reference/COMPLETENESS_REPORT_*.md]
BasedOnStyles =

[CHANGELOG.md]
BasedOnStyles =
