name: Release artifacts

# Builds and publishes the GitHub Release of every v* tag (ADR #131):
#
#   polyris-platform-vX.Y.Z.zip          template + Lambda zips + SFN definitions + UI
#   polyris-platform-vX.Y.Z.zip.sha256   checked by polyris-up after download
#   install.sh                           the CLI installer from this tag
#
# Order matters: create the release as a DRAFT → attach every asset →
# publish. A published release is never missing its archive, and with
# "Immutable releases" enabled in the repo settings nobody can swap the
# files afterwards — they are what polyris-up deploys into users' AWS
# accounts. scripts/release.sh only pushes the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build artifacts for, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  platform-archive:
    name: Platform archive
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Lambda runtime is python3.12 (sam/template.yaml Globals); sam build's
      # pip builder needs the same interpreter on PATH.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Check tag matches package version
        run: |
          VERSION="${TAG#v}"
          grep -q "^version = \"$VERSION\"$" pyproject.toml \
            || { echo "::error::pyproject.toml version is not $VERSION"; exit 1; }

      - name: Install build tools
        run: pip install aws-sam-cli pyyaml boto3

      - name: Build Lambdas (sam build)
        working-directory: sam
        run: sam build --build-dir ../build/sam

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Assemble archive
        run: |
          python scripts/build_platform_release.py \
            --version "${TAG#v}" \
            --sam-build-dir build/sam \
            --ui-dir ui/out \
            --out dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (draft: $(gh release view "$TAG" --json isDraft -q .isDraft))"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "false" ]; then
            # Already published: with Immutable releases its assets are fixed.
            # Re-running for such a tag only succeeds if they are all there.
            have=$(gh release view "$TAG" --json assets -q '.assets[].name')
            for f in "polyris-platform-$TAG.zip" "polyris-platform-$TAG.zip.sha256" install.sh; do
              echo "$have" | grep -qx "$f" || { echo "::error::$TAG is published but lacks $f"; exit 1; }
            done
            echo "Published release already has every asset — nothing to do."
            exit 0
          fi
          gh release upload "$TAG" dist/polyris-platform-*.zip dist/polyris-platform-*.zip.sha256 \
            scripts/install.sh --clobber

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json url,assets -q '.url, (.assets[].name)'
