name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================
  # Python Tests & Linting
  # ============================================
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # rsa (console_api auth.py, ADR #65) ships in the [dev] extra; the SDK
          # tests import the Lambda ROUTES, so the editable install covers them.
          pip install -e ".[dev]"
          pip install ruff mypy cfn-lint

      - name: Lint with ruff
        run: |
          ruff check .

      # Blocking: the wheel ships py.typed, so these annotations are a public
      # contract consumed by downstream mypy runs. A non-blocking check let three
      # real inconsistencies ship (see CHANGELOG v0.93.1).
      - name: Type check with mypy
        run: |
          mypy polyris/ --ignore-missing-imports

      - name: Lint Python + JSON templates
        run: make lint

      - name: Run SDK tests
        run: make test-sdk

      - name: Run backend tests
        run: make test-backend

      - name: Run integration tests
        run: make test-integration

      - name: Run docs drift tests
        run: make test-docs

      - name: Core coverage floor (Principle #22)
        run: make test-cov

      # Codegen drift gates. Each generator has a --check twin; without these in
      # CI a regenerated-but-uncommitted artifact ships silently. (The checkers
      # themselves are unit-tested in tests/sdk/, which is why they sit in the
      # coverage omit list — see pyproject.toml.)
      - name: Check generated enums in sync
        run: make check-generate-enums

      - name: Check generated run_task $dateVars in sync
        run: make check-generate-variables

      - name: Check SFN template status literals
        run: make check-sfn-templates

      - name: Check backfill terminal-status parity
        run: make check-backfill-parity

      # Open-core guard (ADR #98): no paid ee/ or _ee/ path may be tracked here.
      # Companion to the UI's check-oss-build.sh, which proves the free build
      # works with src/ee absent.
      - name: Open-core guard (no paid code in the public repo)
        run: bash scripts/check-no-paid.sh

      - name: Verify version consistency
        run: make check-versions

      - name: Verify pipeline definitions
        run: make smoke-pipelines

      # Last: the probes edit source files while they run. Each puts a fixed coordination
      # defect back and expects the scenario that pins it to fail (tests/backend/coordination).
      - name: Coordination mutation probes
        run: make test-probes

  # ============================================
  # Lambda Tests
  # ============================================
  lambdas:
    name: Lambda Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # rsa = pure-Python RS256 JWT verify in auth.py (ADR #65).
          # moto = real (in-memory) AWS backends for tests that exercise actual
          # boto3 calls rather than mocking them (Principle #14) — e.g.
          # console_api/tests/routes/test_reconcile_sfn_status.py against a real
          # Step Functions backend.
          pip install pytest pytest-mock boto3 "rsa>=4.9" "moto>=4.0.0" pyyaml
          # console_api/routes/backfill.py imports polyris.partitions /
          # polyris.granularity. In the deployed Lambda the polyris package is
          # bundled via Makefile; for CI install it editable so imports match runtime.
          pip install -e .

      - name: Validate Lambda handlers syntax
        run: |
          echo "Checking Lambda handler syntax..."
          find sam/lambdas -name "*.py" -not -path "*/__pycache__/*" -not -path "*/test_*" -not -path "*/tests/*" | while read f; do
            echo "  Checking $f"
            python -m py_compile "$f"
          done
          echo "✅ All Lambda handlers valid"

      - name: Verify Lambda loggers sync
        run: make sync-loggers

      - name: Run notify tests
        run: |
          cd sam/lambdas/notify && PYTHONPATH=. python -m pytest test_notify.py -v

      - name: Run console_api tests
        run: |
          # polyris installed editable above; PYTHONPATH=. keeps the
          # Lambda's own modules (config, routes, dal, …) importable.
          # ee/team/tests live in the private polyris-ee repo (stripped here).
          cd sam/lambdas/console_api && PYTHONPATH=. python -m pytest tests/ -v

      - name: Run coordination tests
        run: |
          # moto tables are built from sam/template.yaml (pyyaml); Step
          # Functions is a fake at the boto3 boundary.
          cd sam/lambdas/coordination && PYTHONPATH=. python -m pytest tests/ -v

      - name: Run query_subscriptions tests
        run: |
          cd sam/lambdas/query_subscriptions && PYTHONPATH=. python -m pytest test_query_subscriptions.py -v

      - name: Run bucket_cleanup tests
        run: |
          cd sam/lambdas/bucket_cleanup && PYTHONPATH=. python -m pytest test_bucket_cleanup.py -v

  # ============================================
  # Step Function Templates
  # ============================================
  sfn-templates:
    name: SFN Templates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: |
          pip install -e . pytest

      - name: Validate ASL templates (JSON + structure)
        run: |
          python -c "
          import json, re
          from pathlib import Path

          templates_dir = Path('sam/sfn_templates')
          errors = []
          count = 0

          for f in templates_dir.rglob('*.json'):
              count += 1
              try:
                  with open(f) as fp:
                      content = fp.read()
                  # Bare numeric Terraform vars like ${pause_heartbeat_seconds} break JSON
                  content = re.sub(r':\s*[$][{](\w+)[}](\s*[,}\]])', r': 99999\2', content)
                  data = json.loads(content)
                  if 'States' not in data:
                      errors.append(f'{f}: missing States')
              except json.JSONDecodeError as e:
                  errors.append(f'{f}: {e}')

          if errors:
              for e in errors:
                  print(f'❌ {e}')
              exit(1)
          else:
              print(f'✅ All {count} templates valid')
          "

      - name: Run SFN flow graph tests
        run: |
          pytest tests/sdk/test_sfn_flow.py -v

      - name: Run JSONata expression tests
        run: |
          cd tests/sfn_jsonata && npm install --silent && npm test

  # ============================================
  # CloudFormation Lint
  # ============================================
  # CLAUDE.md lists `cfn-lint sam/template.yaml` as a quality gate;
  # this job enforces it in CI (separate from sfn-templates so a CFN
  # regression is visible without scrolling through SFN logs).
  cfn-lint:
    name: CFN Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint SAM template
        run: cfn-lint sam/template.yaml

  # ============================================
  # Platform archive — trial build (ADR #131)
  # ============================================
  # Builds the release archive `polyris-up` installs, exactly as
  # release.yml does on a tag, but publishes nothing: a change that breaks
  # `sam build`, the archive script or the deployable template fails here,
  # not on release day. The UI is not rebuilt (the `ui` job covers that);
  # a one-file stand-in fills its slot. Runs in parallel with the other jobs.
  platform-archive:
    name: Platform archive (trial build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Lambda runtime is python3.12 (sam/template.yaml Globals); sam build's
      # pip builder needs the same interpreter on PATH.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install aws-sam-cli pyyaml boto3 cfn-lint

      # The committed pins name the last release, which can predate this branch's SDK; the
      # trial archive carries the checkout's polyris instead (scripts/release.sh moves the pins).
      - name: Point the Lambdas at this checkout's SDK
        run: >-
          sed -i "s|^polyris @ git+.*|polyris @ file://${GITHUB_WORKSPACE}|"
          sam/lambdas/console_api/requirements.txt sam/lambdas/coordination/requirements.txt

      - name: Build Lambdas (sam build)
        working-directory: sam
        run: sam build --build-dir ../build/sam

      # Each function's package must import with only what sam build put in it.
      - name: Import the built functions
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for fn in ReconcileFunction AssetFanoutFunction SweeperFunction; do
            (cd "build/sam/$fn" && python -c "import reconcile, asset_fanout, sweeper")
          done
          (cd build/sam/ConsoleApiFunction && python -c "import main")

      - name: Assemble archive
        run: |
          mkdir -p build/ui-stub && echo '<!doctype html>' > build/ui-stub/index.html
          python scripts/build_platform_release.py \
            --version 0.0.0 \
            --sam-build-dir build/sam \
            --ui-dir build/ui-stub \
            --out build/dist \
            --write-deployable-template build/deployable-template.json

      - name: Lint the template polyris-up deploys
        run: cfn-lint build/deployable-template.json

  # ============================================
  # Docs — link check (lychee)
  # ============================================
  # lychee is a Rust link checker that runs offline against local files.
  # Config: .config/lychee.toml. Doc↔code drift checks (cli flags, entry
  # points, ADR refs, resource counts, pypi installs) live as pytest under
  # `tests/docs/` and run in the `python` job above.
  docs-linkcheck:
    name: Docs Link Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .config/lychee.toml --no-progress './**/*.md'
          fail: true

  # ============================================
  # Docs — prose lint (Vale)
  # ============================================
  # Vale catches the anti-patterns listed in
  # .claude/skills/documentation/SKILL.md: marketing verbs, sentence-start
  # filler adverbs, corp voice, sentences over 40 words.
  # Config: .config/vale.ini + .config/vale/styles/PolyrisDocs.
  #
  # Direct binary install (not vale-cli/vale-action@v3) — the action's
  # `files:` input accepts only ONE folder or `all`, so passing our
  # multi-path scope silently fell back to `all` and scanned unintended
  # paths (node_modules, .venv). Running the binary directly gives us
  # exactly the same paths CI and local use.
  docs-prose:
    name: Docs Prose Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        run: |
          curl -sSL -o /tmp/vale.tgz \
            "https://github.com/vale-cli/vale/releases/download/v3.22.0/vale_3.22.0_Linux_64-bit.tar.gz"
          tar -xzf /tmp/vale.tgz -C /tmp/
          sudo mv /tmp/vale /usr/local/bin/vale
          vale --version

      - name: Run Vale (docs + README + polyris/ + sam/lambdas/)
        run: vale --config .config/vale.ini docs/ README.md polyris/ sam/lambdas/

  # ============================================
  # UI
  # ============================================
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Open-core guard (ADR #99): the public build must be self-contained —
      # with the Team surface (src/ee) removed it must still typecheck + build.
      - name: OSS open-core build guard
        run: bash scripts/check-oss-build.sh
