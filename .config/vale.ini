# Vale — prose style linter (https://vale.sh).
# Enforces the anti-patterns from .claude/skills/documentation/SKILL.md
# and root CLAUDE.md Principle #25 (Clear / Concise / Structured).
#
# Runs in CI via vale-cli/vale-action. To run locally from repo root:
#   vale --config .config/vale.ini docs/ README.md polyris/ sam/lambdas/
#
# Scope:
# - `.md` — all documentation (docs/, README, root CLAUDE.md, polyris/CLAUDE.md, etc.).
# - `.py` — docstrings and `#` comments only. Vale's built-in Python parser
#   ignores identifiers, string literals, and type hints; the rules apply
#   only to prose surfaces where marketing/filler/corp voice can hide.

# Relative to this file's directory (Vale convention) — resolves to
# `.config/vale/styles/PolyrisDocs/*.yml`.
StylesPath = vale/styles
MinAlertLevel = warning

[formats]
md = md

[*.md]
BasedOnStyles = PolyrisDocs

[*.py]
BasedOnStyles = PolyrisDocs

# Historical / frozen docs — same exclusion list as tests/docs/_helpers.py
# and lychee.toml. Allowed to keep whatever prose they had at write time.
[docs/reference/DESIGN_DECISIONS.md]
BasedOnStyles =

[docs/reference/adr-*.md]
BasedOnStyles =

[docs/reference/SPIKE_*.md]
BasedOnStyles =

[docs/reference/COMPLETENESS_REPORT_*.md]
BasedOnStyles =

[CHANGELOG.md]
BasedOnStyles =
