# Vale — prose style linter (https://vale.sh).
# Enforces the anti-patterns from .claude/skills/documentation/SKILL.md
# and root CLAUDE.md Principle #25 (Clear / Concise / Structured).
#
# Runs in CI via vale-cli/vale-action. To run locally from repo root:
#   vale --config .config/vale.ini docs/ README.md polyris/ sam/lambdas/
#
# Scope:
# - `.md` — all documentation (docs/, README, root CLAUDE.md, polyris/CLAUDE.md, etc.).
# - `.py` — docstrings and `#` comments only. Vale's built-in Python parser
#   ignores identifiers, string literals, and type hints; the rules apply
#   only to prose surfaces where marketing/filler/corp voice can hide.

# Relative to this file's directory (Vale convention) — resolves to
# `.config/vale/styles/PolyrisDocs/*.yml`.
StylesPath = vale/styles
MinAlertLevel = warning

[formats]
md = md

[*.md]
BasedOnStyles = PolyrisDocs

[*.py]
BasedOnStyles = PolyrisDocs

# Historical / frozen docs. Allowed to keep whatever prose they had at write time.
# ADRs: no prose style, but the paid-feature rule stays on (Principle #24).
# The seam ADRs describe the free/paid boundary itself, the exception #24 allows;
# scripts/check-oss-purity.sh (SEAM_ADRS) names them, and tests/docs/test_adr_limits.py keeps this list equal.
[docs/decisions/*.md]
BasedOnStyles =
PolyrisDocs.PaidFeatureLeaks = YES

[docs/decisions/adr-{97,98,99,100,101,102,104,105,110}-*.md]
PolyrisDocs.PaidFeatureLeaks = NO

[docs/design/*.md]
BasedOnStyles =

[CHANGELOG.md]
BasedOnStyles =

# PaidFeatureLeaks per-file exceptions.
# `sam/lambdas/**` is internal Lambda code that IS the paid-overlay seam —
# comments legitimately name Slack/PagerDuty when describing what the code
# scaffolds (Principle #24 seam-defining exception, extended from ADRs to
# the code that implements the seam mechanism).
# `docs/CLAUDE.md` is the meta rulebook — its examples about "what not to
# describe in OSS docs" necessarily name Slack/PagerDuty.
[sam/lambdas/**]
PolyrisDocs.PaidFeatureLeaks = NO

[docs/CLAUDE.md]
PolyrisDocs.PaidFeatureLeaks = NO
