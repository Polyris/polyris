[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyris"
version = "0.93.0"
description = "Serverless data pipeline orchestration on AWS Step Functions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3",
]


# =============================================================================
# Linting & Formatting (ruff)
# =============================================================================


[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "moto>=4.0.0",         # AWS mocking
    "pytest-mock>=3.0.0",  # mocker fixture
    "ruff>=0.1.0",         # Linter & formatter
    "mypy>=1.0.0",         # Type checking
    "pyarrow>=14.0.0",     # for adapter tests (polyris.adapters.pyarrow)
    "pydantic>=2.0.0",     # for adapter tests (polyris.adapters.pydantic_)
    "jsonata-python>=0.5.0",  # evaluate SFN template JSONata in CI (ADR #85)
    "rsa>=4.9",            # console_api auth.py imports rsa (Cognito JWT verify, ADR #65)
]
# Schema bridge to the pyarrow ecosystem (Iceberg, Parquet, BigQuery, ...).
# Required to use Asset.from_pyarrow / Asset.from_parquet helpers.
pyarrow = [
    "pyarrow>=14.0.0",
]
# Pydantic schema import. Required to use Asset.from_pydantic.
pydantic = [
    "pydantic>=2.0.0",
]
all = [
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
polyris = "polyris.cli:main"
polyris-deploy = "polyris.deploy:main"
polyris-init = "polyris.init:main"
polyris-output = "polyris.output:main"
polyris-register = "polyris.register:main"
polyris-validate = "polyris.validation:main"

[tool.setuptools.package-data]
polyris = ["py.typed"]

[tool.setuptools.packages.find]
include = ["polyris*"]
exclude = ["polyris._ee*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top of file
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.ruff.format]
# preserve = don't rewrite ' -> " (some smoke tests grep source for quote style)
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# SAM lambda constants.py files re-export from constants_generated for their
# modules (`from constants import X`); the re-exports look unused in-file.
"sam/lambdas/**/constants.py" = ["F401"]
"tests/*" = ["E501"]

# =============================================================================
# Type Checking (mypy)
# =============================================================================

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true

# =============================================================================
# Testing (pytest)
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests/sdk", "tests/backend", "tests/integration"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "sdk: SDK/library tests (ASL generation, templates, trigger rules)",
    "backend: Backend API tests (routes, alerting, handlers)",
    "integration: Integration tests (cross-layer, requires mocked AWS)",
]

[tool.coverage.run]
source = ["polyris"]
omit = [
    # AWS-touching CLI / build tooling. These call boto3 or shell out; mocking
    # AWS just to colour their lines would only test the mock (#11, #13, #14),
    # so they are covered by e2e/smoke (#15, #16) instead and sit outside the
    # pure-logic core floor (Principle #22).
    #
    # NOTE: "covered by e2e/smoke" is a claim about AWS paths only. A module
    # that touches no AWS does not belong here — output.py, init.py and roles.py
    # were on this list with zero boto3 references and nothing reaching them,
    # which is how the two CLIs the README tells every new user to run stayed
    # untested. All three are now measured. Before adding a module here, check
    # it actually needs AWS; if it does not, write the test.
    #
    # KNOWN DEBT (measured 2026-07, not yet closed): the two below are majority
    # pure logic, so this exemption is wider than it should be.
    #   local.py     ~20% AWS — only _run_localstack (106 lines) touches boto3;
    #                validate / dry_run / run / _run_mock / _parse_execution_history
    #                / run_cli are pure and unmeasured (module at ~21%).
    #   register.py  only get_sfn_client touches boto3; register_pipeline,
    #                find_sfn_arn and main (111 lines) are pure (module at ~22%).
    # The right shape is to split the AWS call out and measure the rest, the way
    # output.py/init.py were closed — not to keep the whole module exempt.
    "polyris/deploy.py",
    "polyris/register.py",
    "polyris/local.py",
    "polyris/codegen/sync_enums.py",
    "polyris/codegen/sync_variables.py",
    # codegen drift-checkers. Their *logic* is unit-tested against tmp_path
    # fixtures (tests/sdk/test_sfn_template_drift.py,
    # tests/sdk/test_backfill_status_parity.py); what is omitted here is the
    # module-level repo-tree wiring, which would need filesystem mocking to
    # colour (#11/#13). They also run as blocking CI steps (make
    # check-sfn-templates / check-backfill-parity in ci.yml) against the real
    # tree, which is the check that actually matters.
    "polyris/codegen/check_sfn_templates.py",
    "polyris/codegen/check_shared_constants.py",
    "polyris/codegen/check_backfill_status_parity.py",
    "polyris/__init__.py",
    "polyris/*/__init__.py",
]

[tool.coverage.report]
# Pure-logic core floor (Principle #22). The measured core — every module not
# in the AWS/CLI/build omit list above — is fully covered. The floor is the
# achieved level: any new logic line must arrive with a test or a justified
# `# pragma: no cover`, never a silent coverage regression.
fail_under = 100
precision = 1
show_missing = true
