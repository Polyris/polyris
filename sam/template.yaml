AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Polyris — Serverless Data Pipeline Orchestration Platform.
  Deploys shared infrastructure: Step Functions, DynamoDB, Lambda, API Gateway, Cognito, SSM.

# =============================================================================
# Parameters
# =============================================================================
Parameters:

  Namespace:
    Type: String
    Description: Organization namespace used in resource naming (e.g. myorg)
    Default: polyris

  Stage:
    Type: String
    Description: Deployment stage (e.g. dev, prod)
    Default: dev

  # DEPRECATED (ADR #131) — kept only so existing samconfig.toml files that
  # still pass AwsRegion=... keep deploying. Nothing references it: every
  # region in this template is the built-in AWS::Region, i.e. the region the
  # stack is actually deployed to, so the two can no longer drift apart.
  # Remove in the next major version.
  AwsRegion:
    Type: String
    Description: DEPRECATED and ignored. The stack always uses the region it is deployed to.
    Default: ""

  PolyrisTier:
    Type: String
    Description: >
      Paid tier this deployment runs as (ADR #100). Controls the team<->enterprise
      entitlement boundary at runtime — both paid tiers ship in one build; this
      value decides what is enabled. Ignored by the OSS build, which has no ee/ code.
    AllowedValues:
      - team
      - enterprise
    Default: team



  DefaultSlackMentions:
    Type: String
    Description: Default Slack mentions (e.g. <@U12345>). Leave empty to disable.
    Default: ""


  SfnLogLevel:
    Type: String
    Description: Step Functions logging level for Standard state machines
    Default: ERROR
    AllowedValues: [ALL, ERROR, FATAL, "OFF"]

  SfnExpressLogLevel:
    Type: String
    Description: Step Functions logging level for Express state machines (ALL recommended for observability)
    Default: ALL
    AllowedValues: [ALL, ERROR, FATAL, "OFF"]

  LogRetentionDays:
    Type: Number
    Description: CloudWatch Logs retention in days for Standard SFN and Lambda
    Default: 14

  ExpressLogRetentionDays:
    Type: Number
    Description: CloudWatch Logs retention in days for Express SFN (ALL level = more logs)
    Default: 7

  EnablePitr:
    Type: String
    Description: Enable DynamoDB Point-in-Time Recovery
    Default: "false"
    AllowedValues: ["true", "false"]

  EnableCognitoAuth:
    Type: String
    Description: Enable Cognito authentication for Console API
    Default: "true"
    AllowedValues: ["true", "false"]

  AdminEmail:
    Type: String
    Description: >-
      Optional. Email of the first console admin (ADR #131). When set and
      EnableCognitoAuth is true, the stack creates this Cognito user and Cognito
      emails it a temporary password. Leave empty to create users yourself.
      Changing it replaces the user (the previous one is deleted).
    Default: ""

  ConsoleUrlOverride:
    Type: String
    Description: >-
      Optional custom domain for the Console UI (e.g. https://polyris.myorg.com).
      Leave empty to use the auto-generated CloudFront URL.
      CloudFront URL is added to Cognito callbacks automatically.
    Default: ""

  EnableInfraMonitoring:
    Type: String
    Description: Enable CloudWatch alarms for infrastructure monitoring
    Default: "false"
    AllowedValues: ["true", "false"]

  ConsoleUiBuildPath:
    Type: String
    Description: >
      Local path to built UI files (relative to sam/ directory).
      Run 'cd ui && npm run build' first, then set to '../ui/out'.
    Default: "../ui/out"

  # Prebuilt-UI parameters (ADR #131). Filled in by `polyris-up`, which uploads
  # the release's prebuilt UI to its artifacts bucket and passes the location
  # here; the UiBootstrap custom resource then copies it into ConsoleUiBucket
  # and writes config.js. Leave both empty for a from-source `sam deploy`, where
  # ui/deploy.sh uploads the UI instead.
  ArtifactsBucket:
    Type: String
    Description: >-
      S3 bucket holding the prebuilt UI (set by polyris-up). Leave empty for a
      from-source sam deploy (the UI is then uploaded by ui/deploy.sh).
    Default: ""

  UiArtifactsPrefix:
    Type: String
    Description: >-
      Key prefix of the prebuilt UI inside ArtifactsBucket (set by polyris-up;
      contains the release version and a content hash, so a new build always
      changes it).
    Default: ""

  LambdaReservedConcurrency:
    Type: Number
    Description: Reserved concurrent executions for Lambda functions (-1 = no limit)
    Default: -1

  AutoEmptyBucketsOnDelete:
    Type: String
    Description: >
      DEV/TEST — deploy a small Lambda that empties ConsoleUiBucket and
      ResultsBucket when the stack is deleted. Without this, `sam delete`
      fails on non-empty S3 buckets and you have to empty them by hand.
      NEVER enable in prod without a backup: turning this on means a
      stack delete SILENTLY wipes every task result in ResultsBucket.
    Default: "false"
    AllowedValues: ["true", "false"]

# =============================================================================
# Globals
# =============================================================================
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Tags:
      Environment: polyris
      Stack: Data Orchestration
      Stage: !Ref Stage
      Namespace: !Ref Namespace
      ManagedBy: cloudformation

# =============================================================================
# Conditions
# =============================================================================
Conditions:
  EnablePitrCondition: !Equals [!Ref EnablePitr, "true"]
  EnableCognitoAuthCondition: !Equals [!Ref EnableCognitoAuth, "true"]
  CreateAdminUserCondition: !And
    - !Condition EnableCognitoAuthCondition
    - !Not [!Equals [!Ref AdminEmail, ""]]
  HasReservedConcurrency: !Not [!Equals [!Ref LambdaReservedConcurrency, -1]]
  HasConsoleUrlOverride: !Not [!Equals [!Ref ConsoleUrlOverride, ""]]
  HasUiArtifacts: !Not [!Equals [!Ref ArtifactsBucket, ""]]
  AutoEmptyBucketsCondition: !Equals [!Ref AutoEmptyBucketsOnDelete, "true"]

# =============================================================================
# Resources
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # DynamoDB Tables
  # ---------------------------------------------------------------------------

  PipelineTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Namespace}-${Stage}-polyris-pipeline-tokens"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: execution_name
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: execution_name
          AttributeType: S
        - AttributeName: pipeline_execution
          AttributeType: S
        - AttributeName: date
          AttributeType: S
        - AttributeName: pipeline_name
          AttributeType: S
        - AttributeName: backfill_id
          AttributeType: S
        - AttributeName: attention
          AttributeType: S
        - AttributeName: attention_at
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: pipeline-execution-index
          KeySchema:
            - AttributeName: pipeline_execution
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: date-pipeline-index
          KeySchema:
            - AttributeName: date
              KeyType: HASH
            - AttributeName: pipeline_name
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - started_at
              - finished_at
              - running_at
              - pipeline_execution
              - pipeline_execution_short
              - task_name
              - dependencies
              - wait_for
              - wrapper_execution_arn
              - error
              - notification_failed
        - IndexName: pipeline-date-index
          # Inverse of date-pipeline-index: lets us ask "this pipeline's runs,
          # newest first" in ONE query instead of looping a day at a time.
          # Both key attributes are already written on every task row, so this
          # index needs no write-path change and AWS backfills it from existing
          # rows. Depth is then bounded only by the row TTL, not by a window
          # constant (ADR: read runs by pipeline via inverted GSI).
          KeySchema:
            - AttributeName: pipeline_name
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - started_at
              - finished_at
              - pipeline_execution
              - pipeline_execution_short
              - task_name
        - IndexName: backfill-id-index
          KeySchema:
            - AttributeName: backfill_id
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - started_at
              - finished_at
              - pipeline_name
              - pipeline_execution
              - partition_key
              - record_type
              - target_pipeline
              - total_partitions
              - completed_partitions
              - failed_partitions
              - skipped_partitions
              - cascade
              - started_by
        # ADR #130 §7: sparse. Only rows that may need a wake (waiting#h),
        # push retries (retry#h) and coordination warnings (warn#h) carry
        # `attention`; `attention_at` is the row's due time.
        - IndexName: attention-index
          KeySchema:
            - AttributeName: attention
              KeyType: HASH
            - AttributeName: attention_at
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
              - task_name
              - pipeline_name
              - pipeline_execution
              - task_date
              - kind
              - error
              - finished_at
              - started_at
              - attempts
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [EnablePitrCondition, true, false]
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stack
          Value: Data Orchestration
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace
        - Key: Name
          Value: !Sub "${Namespace}-${Stage}-polyris-pipeline-tokens"

  DependencySubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Namespace}-${Stage}-polyris-dep-subscriptions"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: dependency_key
          KeyType: HASH
        - AttributeName: subscriber
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: dependency_key
          AttributeType: S
        - AttributeName: subscriber
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: subscriber-index
          KeySchema:
            - AttributeName: subscriber
              KeyType: HASH
            - AttributeName: dependency_key
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stack
          Value: Data Orchestration
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  PipelineRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Namespace}-${Stage}-polyris-pipeline-registry"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pipeline_name
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: pipeline_name
          AttributeType: S
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [EnablePitrCondition, true, false]
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stack
          Value: Data Orchestration
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  AssetEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Namespace}-${Stage}-polyris-asset-events"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: asset_name
          KeyType: HASH
        - AttributeName: event_time
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: asset_name
          AttributeType: S
        - AttributeName: event_time
          AttributeType: S
        - AttributeName: execution_date
          AttributeType: S
        - AttributeName: partition_date
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: date-index
          KeySchema:
            - AttributeName: execution_date
              KeyType: HASH
            - AttributeName: event_time
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # ADR #130 §4, §7: asset conditions read facts by partition, newest
        # first. Sparse: facts written before ADR #130 get `partition_date`
        # during sweeper adoption.
        - IndexName: asset-partition-index
          KeySchema:
            - AttributeName: asset_name
              KeyType: HASH
            - AttributeName: partition_date
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - event_time
              - partition_key
              - granularity
              - cascade
              - source_dag
              - uri
      # ADR #130 §6.1: new facts reach AssetFanout through this stream.
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stack
          Value: Data Orchestration
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  TaskEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Namespace}-${Stage}-polyris-task-events"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: task_run_id
          KeyType: HASH
        - AttributeName: event_time
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: task_run_id
          AttributeType: S
        - AttributeName: event_time
          AttributeType: S
        - AttributeName: parent_execution_id
          AttributeType: S
        - AttributeName: execution_name
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: parent-execution-index
          KeySchema:
            - AttributeName: parent_execution_id
              KeyType: HASH
            - AttributeName: event_time
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: execution-name-index
          KeySchema:
            - AttributeName: execution_name
              KeyType: HASH
            - AttributeName: event_time
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stack
          Value: Data Orchestration
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  ApiTokensTable:
    Type: AWS::DynamoDB::Table
    # Personal Access Tokens (ADR #65). Dedicated table — keeps a security
    # credential separate from operational data. On-demand: zero idle cost.
    Properties:
      TableName: !Sub "${Namespace}-${Stage}-polyris-api-tokens"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: token_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: token_id
          AttributeType: S
        - AttributeName: token_hash
          AttributeType: S
        - AttributeName: owner_sub
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: hash-index
          KeySchema:
            - AttributeName: token_hash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: owner-index
          KeySchema:
            - AttributeName: owner_sub
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stack
          Value: Data Orchestration
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  AssetSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Namespace}-${Stage}-polyris-asset-subscriptions"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: asset_name
          KeyType: HASH
        - AttributeName: pipeline_name
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: asset_name
          AttributeType: S
        - AttributeName: pipeline_name
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stack
          Value: Data Orchestration
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  # ---------------------------------------------------------------------------
  # S3 Bucket — polyris-deploy CloudFormation artifact storage.
  #
  # Used by `polyris-deploy` (see polyris/deploy.py:755) to stage packaged
  # SAM templates during `sam package`. NOT an XCom store — user XCom values
  # live in DynamoDB (pipeline-tokens), and the manual Claim Check pattern
  # (`return {"_s3_ref": "s3://your-bucket/..."}`) points to the user's own
  # bucket. See docs/features/DATA_PASSING.md#large-outputs.
  # ---------------------------------------------------------------------------

  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Namespace}-${Stage}-polyris-results"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireResults
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  # ---------------------------------------------------------------------------
  # IAM — Shared execution role for Step Functions, API Gateway, EventBridge
  # ---------------------------------------------------------------------------


  CrossAccountPipelineRole:
    Type: AWS::IAM::Role
    # The trust policy names OrchestrationRole by ARN-string (via !Sub, kept so it
    # can be repointed at a role in another account — see Description). A string
    # principal gives CFN no implicit dependency, so on a fresh stack this role
    # could be created before OrchestrationRole exists → "Invalid principal in
    # policy". DependsOn supplies the ordering CFN can't infer.
    DependsOn: OrchestrationRole
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-default-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Namespace}-${Stage}-polyris-orchestration-role"
            Action: sts:AssumeRole
      Description: >
        Role assumed by orchestration when running task SFNs in same account.
        For cross-account: replace with a role in the target account.
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  CrossAccountPipelinePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${Namespace}-${Stage}-polyris-default-task-policy"
      Roles:
        - !Ref CrossAccountPipelineRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - states:StartExecution
              - states:DescribeExecution
              - states:StopExecution
            Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*"
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"
          - Effect: Allow
            Action:
              - glue:StartJobRun
              - glue:GetJobRun
              - glue:BatchStopJobRun
            Resource: "*"
          - Effect: Allow
            Action:
              - ecs:RunTask
              - ecs:StopTask
              - ecs:DescribeTasks
              - iam:PassRole
            Resource: "*"
          - Effect: Allow
            Action:
              - athena:StartQueryExecution
              - athena:GetQueryExecution
              - athena:GetQueryResults
              - athena:StopQueryExecution
            Resource: "*"
          # Glue Data Catalog access — everything an Athena-driven ETL task
          # needs out of the box. Split into read + write for auditability.
          #
          # READS: Athena engine v3 consults Glue for every query's schema
          # (database, table, partitions). Without these even a trivial
          # `SELECT 1 FROM db.t` fails with `glue:GetDatabase Access­DeniedException`.
          # Also covers connections/UDFs for federated queries.
          - Effect: Allow
            Action:
              - glue:GetDatabase
              - glue:GetDatabases
              - glue:GetTable
              - glue:GetTables
              - glue:GetTableVersion
              - glue:GetTableVersions
              - glue:GetPartition
              - glue:GetPartitions
              - glue:BatchGetPartition
              - glue:GetUserDefinedFunction
              - glue:GetUserDefinedFunctions
              - glue:GetConnection
              - glue:GetConnections
            Resource: "*"
          # WRITES: Table + Partition CRUD, so CTAS (`CREATE TABLE AS SELECT`),
          # `INSERT INTO`, `DROP TABLE`, `ALTER TABLE`, and partition-aware
          # workflows (Iceberg / Hive-style partitioned tables) work without
          # extra IAM. Database CRUD is deliberately excluded — creating /
          # dropping databases is an admin operation, not a per-task action;
          # provision databases via CFN / Terraform and reference them from
          # task queries.
          - Effect: Allow
            Action:
              - glue:CreateTable
              - glue:UpdateTable
              - glue:DeleteTable
              - glue:CreatePartition
              - glue:UpdatePartition
              - glue:DeletePartition
              - glue:BatchCreatePartition
              - glue:BatchUpdatePartition
              - glue:BatchDeletePartition
            Resource: "*"
          # Athena runs queries under this role's identity: it reads source data and
          # writes results to the query's output location — both user-chosen buckets.
          # Granted broadly to match the service actions above so @task.athena_query
          # works out of the box; scope the Resource to your specific buckets to
          # tighten it.
          - Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
            Resource: "*"
          - Effect: Allow
            Action:
              - elasticmapreduce:RunJobFlow
              - elasticmapreduce:DescribeCluster
              - elasticmapreduce:TerminateJobFlows
            Resource: "*"
          - Effect: Allow
            Action:
              - batch:SubmitJob
              - batch:DescribeJobs
              - batch:TerminateJob
            Resource: "*"

  OrchestrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-orchestration-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - states.amazonaws.com
                - apigateway.amazonaws.com
                - events.amazonaws.com
                - scheduler.amazonaws.com
            Action: sts:AssumeRole
      Description: >
        Step Functions execution role: states + lambda invoke + sts assume-role +
        EventBridge managed rules + DynamoDB + CloudWatch logs
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  OrchestrationRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${Namespace}-${Stage}-polyris-orchestration-policy"
      Roles:
        - !Ref OrchestrationRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowStates
            Effect: Allow
            Action:
              - states:StartExecution
              - states:StartSyncExecution
              - states:DescribeExecution
              - states:StopExecution
              - states:ListExecutions
              - states:RedriveExecution
              - states:InvokeHTTPEndpoint
              - states:SendTaskSuccess
              - states:SendTaskFailure
              - states:SendTaskHeartbeat
              - states:DescribeStateMachine
              - states:ListStateMachines
            Resource: "*"
          - Sid: AllowLambdaInvoke
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: "*"
          - Sid: AllowDynamoDB
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
            Resource:
              - !GetAtt PipelineTokensTable.Arn
              - !Sub "${PipelineTokensTable.Arn}/index/*"
              - !GetAtt DependencySubscriptionsTable.Arn
              - !Sub "${DependencySubscriptionsTable.Arn}/index/*"
              - !GetAtt PipelineRegistryTable.Arn
              - !Sub "${PipelineRegistryTable.Arn}/index/*"
              - !GetAtt AssetEventsTable.Arn
              - !Sub "${AssetEventsTable.Arn}/index/*"
              - !GetAtt TaskEventsTable.Arn
              - !Sub "${TaskEventsTable.Arn}/index/*"
              - !GetAtt AssetSubscriptionsTable.Arn
              - !Sub "${AssetSubscriptionsTable.Arn}/index/*"
          - Sid: AllowS3Results
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${ResultsBucket.Arn}/*"
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Action:
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "*"
          - Sid: AllowEventBridge
            Effect: Allow
            Action:
              - events:PutTargets
              - events:PutRule
              - events:DescribeRule
              - events:DeleteRule
              - events:RemoveTargets
              - events:PutEvents
              - events:InvokeApiDestination
              - events:RetrieveConnectionCredentials
            Resource: "*"
          - Sid: AllowAssumeRole
            Effect: Allow
            Action:
              - sts:AssumeRole
            Resource: "*"
          - Sid: AllowXRay
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
            Resource: "*"
          - Sid: AllowIamPassRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: "*"
            Condition:
              StringLike:
                iam:PassedToService:
                  - states.amazonaws.com
                  - ecs-tasks.amazonaws.com
                  - batch.amazonaws.com
          - Sid: AllowTaskServices
            Effect: Allow
            Action:
              - ecs:RunTask
              - ecs:StopTask
              - ecs:DescribeTasks
              - batch:SubmitJob
              - batch:TerminateJob
              - batch:DescribeJobs
              - glue:StartJobRun
              - glue:GetJobRun
              - glue:GetJobRuns
              - glue:BatchStopJobRun
              - glue:GetDatabase
              - glue:GetDatabases
              - glue:GetTable
              - glue:GetTables
              - glue:GetPartition
              - glue:GetPartitions
              - athena:StartQueryExecution
              - athena:StopQueryExecution
              - athena:GetQueryExecution
              - athena:GetQueryResults
              - elasticmapreduce:AddJobFlowSteps
              - elasticmapreduce:CancelSteps
              - elasticmapreduce:DescribeStep
            Resource: "*"
          - Sid: AllowSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: "*"

  # ---------------------------------------------------------------------------
  # CloudWatch Log Groups — Step Functions
  # ---------------------------------------------------------------------------

  DependencyWrapperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-dependency-wrapper"
      RetentionInDays: !Ref LogRetentionDays

  RunTaskHelperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-run-task-helper"
      RetentionInDays: !Ref LogRetentionDays

  RegistrationHelperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-registration-helper"
      RetentionInDays: !Ref LogRetentionDays

  FailureHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-failure-handler"
      RetentionInDays: !Ref LogRetentionDays

  NotifyDependentsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-notify-dependents"
      RetentionInDays: !Ref LogRetentionDays


  PauseWaiterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-pause-waiter"
      RetentionInDays: !Ref LogRetentionDays

  RestartWrapperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-restart-wrapper"
      RetentionInDays: !Ref LogRetentionDays

  RestartTaskHelperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-restart-task-helper"
      RetentionInDays: !Ref LogRetentionDays

  BulkBackfillLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-bulk-backfill"
      RetentionInDays: !Ref LogRetentionDays

  TestSfnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${Namespace}-${Stage}-polyris-test"
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # Lambda Log Groups
  # ---------------------------------------------------------------------------

  NotifyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Namespace}-${Stage}-polyris-notify"
      RetentionInDays: !Ref LogRetentionDays

  QuerySubscriptionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Namespace}-${Stage}-polyris-query-subscriptions"
      RetentionInDays: !Ref LogRetentionDays

  ConsoleApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Namespace}-${Stage}-polyris-console-api"
      RetentionInDays: !Ref LogRetentionDays

  ReconcileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Namespace}-${Stage}-polyris-reconcile"
      RetentionInDays: !Ref LogRetentionDays

  AssetFanoutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Namespace}-${Stage}-polyris-asset-fanout"
      RetentionInDays: !Ref LogRetentionDays

  SweeperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Namespace}-${Stage}-polyris-sweeper"
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # Lambda Functions
  # ---------------------------------------------------------------------------

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Namespace}-${Stage}-polyris-notify"
      CodeUri: lambdas/notify/
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt NotifyRole.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref NotifyLogGroup
      Environment:
        Variables:
          PIPELINES_TABLE: !Ref PipelineRegistryTable
      Tags:
        Environment: polyris
        Stage: !Ref Stage
        Namespace: !Ref Namespace

  QuerySubscriptionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Namespace}-${Stage}-polyris-query-subscriptions"
      CodeUri: lambdas/query_subscriptions/
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt QuerySubscriptionsRole.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref QuerySubscriptionsLogGroup
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !Ref DependencySubscriptionsTable
      Tags:
        Environment: polyris
        Stage: !Ref Stage
        Namespace: !Ref Namespace

  ReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Namespace}-${Stage}-polyris-reconcile"
      CodeUri: lambdas/coordination/
      Handler: reconcile.handler
      # Resume handles one run's rows for at most 20 s (RESUME_BUDGET_SECONDS),
      # then leaves the rest due for the sweeper.
      Timeout: 30
      # Every task wake runs through this function; CPU scales with memory,
      # and 256 MB keeps the boto3 cold start short for a negligible GB-s cost.
      MemorySize: 256
      Role: !GetAtt ReconcileRole.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref ReconcileLogGroup
      Environment:
        Variables:
          TOKENS_TABLE: !Ref PipelineTokensTable
          SUBSCRIPTIONS_TABLE: !Ref DependencySubscriptionsTable
          ASSET_EVENTS_TABLE: !Ref AssetEventsTable
          PIPELINES_TABLE: !Ref PipelineRegistryTable
      Tags:
        Environment: polyris
        Stage: !Ref Stage
        Namespace: !Ref Namespace

  # ADR #130 §6.1: wakes the tasks waiting on each new asset fact.
  AssetFanoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Namespace}-${Stage}-polyris-asset-fanout"
      CodeUri: lambdas/coordination/
      Handler: asset_fanout.handler
      # Stops starting records 10 s before the end (RESERVE_MS); the rest
      # are redelivered.
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt AssetFanoutRole.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref AssetFanoutLogGroup
      Environment:
        Variables:
          TOKENS_TABLE: !Ref PipelineTokensTable
          SUBSCRIPTIONS_TABLE: !Ref DependencySubscriptionsTable
          ASSET_EVENTS_TABLE: !Ref AssetEventsTable
          PIPELINES_TABLE: !Ref PipelineRegistryTable
          ASSET_SUBSCRIPTIONS_TABLE: !Ref AssetSubscriptionsTable
      Tags:
        Environment: polyris
        Stage: !Ref Stage
        Namespace: !Ref Namespace

  # ADR #130 §6.1. Retries until the record is handled (records live for the
  # stream's 24 h); a record AssetFanout cannot handle becomes a warning in
  # the handler itself, so there is no on-failure destination (D22).
  AssetEventsFanoutMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt AssetEventsTable.StreamArn
      FunctionName: !Ref AssetFanoutFunction
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      MaximumRetryAttempts: -1
      MaximumRecordAgeInSeconds: -1
      BisectBatchOnFunctionError: true
      FunctionResponseTypes:
        - ReportBatchItemFailures
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName": ["INSERT"]}'

  # ADR #130 §8: every 5 minutes, re-checks the waiting tasks that are due, so a
  # lost wake-up hint delays a task and never loses it.
  SweeperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Namespace}-${Stage}-polyris-sweeper"
      CodeUri: lambdas/coordination/
      Handler: sweeper.handler
      # A run works for at most 200 s (sweep.BUDGET) and holds its lease for 270 s,
      # so a run that dies never blocks the next one 5 minutes later.
      Timeout: 240
      MemorySize: 256
      Role: !GetAtt SweeperRole.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref SweeperLogGroup
      Environment:
        Variables:
          TOKENS_TABLE: !Ref PipelineTokensTable
          SUBSCRIPTIONS_TABLE: !Ref DependencySubscriptionsTable
          ASSET_EVENTS_TABLE: !Ref AssetEventsTable
          PIPELINES_TABLE: !Ref PipelineRegistryTable
          ASSET_SUBSCRIPTIONS_TABLE: !Ref AssetSubscriptionsTable
      Tags:
        Environment: polyris
        Stage: !Ref Stage
        Namespace: !Ref Namespace

  # No retry: a missed run is covered by the next one, 5 minutes later.
  SweeperSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${Namespace}-${Stage}-polyris-sweeper"
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt SweeperFunction.Arn
        RoleArn: !GetAtt SweeperScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0

  ConsoleApiFunction:
    Type: AWS::Serverless::Function
    # polyris SDK is vendored as `polyris/` subdirectory before `sam build`
    # via the top-level `make sam-build` target. Default Python builder
    # then packages it like any other Lambda source file. See top-level
    # Makefile :: sam-build and .gitignore for the contract.
    Properties:
      FunctionName: !Sub "${Namespace}-${Stage}-polyris-console-api"
      CodeUri: lambdas/console_api/
      Handler: main.handler
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref LambdaReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt ConsoleApiRole.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref ConsoleApiLogGroup
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref PipelineTokensTable
          PIPELINES_TABLE: !Ref PipelineRegistryTable
          SUBSCRIPTIONS_TABLE: !Ref DependencySubscriptionsTable
          ASSET_EVENTS_TABLE: !Ref AssetEventsTable
          TASK_EVENTS_TABLE: !Ref TaskEventsTable
          ASSET_SUBSCRIPTIONS_TABLE: !Ref AssetSubscriptionsTable
          API_TOKENS_TABLE: !Ref ApiTokensTable
          # ADR #65/#66: auth enforcement follows EnableCognitoAuth — true when
          # Cognito is enabled, false otherwise. Public paths: /api/health*,
          # /api/metrics, /api/action/*.
          AUTH_ENABLED: !If [EnableCognitoAuthCondition, "true", "false"]
          # Offline Cognito JWT verification (auth.py) — issuer + client binding.
          # Empty when Cognito is not enabled in this deployment.
          COGNITO_USER_POOL_ID: !If [EnableCognitoAuthCondition, !Ref CognitoUserPool, ""]
          COGNITO_CLIENT_ID: !If [EnableCognitoAuthCondition, !Ref CognitoUserPoolClient, ""]
          REGION: !Ref AWS::Region
          ACCOUNT_ID: !Ref AWS::AccountId
          # Namespace + Stage are read by ee/team/alert_secrets.py to scope
          # the SSM alert-secret parameter path
          # (/polyris/alerts/${Namespace}/${Stage}/<pipeline>/<key>). Absent
          # in OSS-only builds; the env vars are still populated for
          # consistency and future use.
          NAMESPACE: !Ref Namespace
          STAGE: !Ref Stage
          # ADR #100: paid tier for the team<->enterprise entitlement boundary.
          # Read only by ee/entitlements.py (absent in the OSS build).
          POLYRIS_TIER: !Ref PolyrisTier
          RESULTS_BUCKET: !Ref ResultsBucket
          ASSET_EVENT_TTL_DAYS: "365"
          RESTART_HELPER_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Namespace}-${Stage}-polyris-restart-task-helper"
          NOTIFY_DEPENDENTS_HELPER_ARN: !Ref NotifyDependentsSfn
          NOTIFY_FUNCTION_ARN: !GetAtt NotifyFunction.Arn
          RECONCILE_FUNCTION_ARN: !GetAtt ReconcileFunction.Arn
          BULK_BACKFILL_ARN: !Ref BulkBackfillSfn
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConsoleApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConsoleApi
            Path: /
            Method: ANY
      Tags:
        Environment: polyris
        Stage: !Ref Stage
        Namespace: !Ref Namespace

  # ---------------------------------------------------------------------------
  # Lambda IAM Roles
  # ---------------------------------------------------------------------------

  NotifyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-notify-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NotifyPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read alert secrets (Slack webhook, PagerDuty key) from SSM
              # SecureString. Scoped to /polyris/alerts/{Namespace}/{Stage}/*
              # so two stacks in the same account/region cannot see each
              # other's alert configs, and so pipelines with the same name
              # across stacks don't collide on the same SSM key.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/polyris/alerts/${Namespace}/${Stage}/*"
              # Read alert_config from the pipeline registry to fan out over
              # enabled channels (ADR #103 Stage-1 consolidation).
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt PipelineRegistryTable.Arn

  QuerySubscriptionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-query-subscriptions-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: QuerySubscriptionsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !GetAtt DependencySubscriptionsTable.Arn
                  - !Sub "${DependencySubscriptionsTable.Arn}/index/*"

  CoordinationReconcilePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Namespace}-${Stage}-polyris-reconcile"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Task row, dependency rows and pause flag (consistent reads);
          # park / close / attention updates; warning rows.
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:UpdateItem
              - dynamodb:PutItem
            Resource:
              - !GetAtt PipelineTokensTable.Arn
          # Resume: candidate rows of one run.
          - Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !Sub "${PipelineTokensTable.Arn}/index/pipeline-execution-index"
          # Pointers are deleted once the signal was accepted.
          - Effect: Allow
            Action:
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt DependencySubscriptionsTable.Arn
          # Asset facts: the partition index plus recent writes (base table).
          - Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !GetAtt AssetEventsTable.Arn
              - !Sub "${AssetEventsTable.Arn}/index/asset-partition-index"
          # Declared granularity of facts written before ADR #130.
          - Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource:
              - !GetAtt PipelineRegistryTable.Arn
          # Task tokens have no resource-level permissions.
          - Effect: Allow
            Action:
              - states:SendTaskSuccess
              - states:SendTaskFailure
            Resource: "*"
          # Dead-token check on the task's wrapper execution.
          - Effect: Allow
            Action:
              - states:DescribeExecution
            Resource:
              - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${Namespace}-${Stage}-polyris-dependency-wrapper:*"

  ReconcileRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-reconcile-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref CoordinationReconcilePolicy

  # AssetFanout runs the reconciler in-process; beyond its policy it reads
  # the asset-events stream and the asset:{name} subscriptions.
  AssetFanoutRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-asset-fanout-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref CoordinationReconcilePolicy
      Policies:
        - PolicyName: AssetFanoutPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  - !GetAtt AssetEventsTable.StreamArn
              # Tasks waiting on the fact's asset, and pipelines scheduled on it
              # (consistent reads).
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !GetAtt DependencySubscriptionsTable.Arn
                  - !GetAtt AssetSubscriptionsTable.Arn
              # Push: start a consumer pipeline (deterministic name, so never twice).
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*"

  # The sweeper runs the reconciler in-process; beyond its policy it reads the
  # due rows from the attention index and keeps its lease row.
  SweeperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-sweeper-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref CoordinationReconcilePolicy
      Policies:
        - PolicyName: SweeperPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Waiting rows that are due (ADR #130 §7).
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub "${PipelineTokensTable.Arn}/index/attention-index"
              # Releasing the lease row and dropping push retry rows; writes the policy allows.
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt PipelineTokensTable.Arn
              # The catch-up: the subscribed assets, and each one's push consumers.
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt AssetSubscriptionsTable.Arn
              # Push retries and the catch-up start consumer pipelines (deterministic names).
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*"

  SweeperScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-sweeper-schedule-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSweeper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt SweeperFunction.Arn

  ConsoleApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-console-api-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConsoleApiPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt PipelineTokensTable.Arn
                  - !Sub "${PipelineTokensTable.Arn}/index/*"
                  - !GetAtt PipelineRegistryTable.Arn
                  - !Sub "${PipelineRegistryTable.Arn}/index/*"
                  - !GetAtt DependencySubscriptionsTable.Arn
                  - !Sub "${DependencySubscriptionsTable.Arn}/index/*"
                  - !GetAtt AssetEventsTable.Arn
                  - !Sub "${AssetEventsTable.Arn}/index/*"
                  - !GetAtt TaskEventsTable.Arn
                  - !Sub "${TaskEventsTable.Arn}/index/*"
                  - !GetAtt AssetSubscriptionsTable.Arn
                  - !GetAtt ApiTokensTable.Arn
                  - !Sub "${ApiTokensTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - states:StartExecution
                  - states:StopExecution
                  - states:DescribeExecution
                  - states:ListExecutions
                  # /api/health (Step Functions check) and the pipeline-ARN
                  # fallback in pipelines_list / pipelines_actions.
                  - states:ListStateMachines
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                  - states:SendTaskHeartbeat
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${ResultsBucket.Arn}/*"
              # Alert-secret SSM writes — the EE Team-tier alerts route
              # (ee/team/alerts.py → alert_secrets.py) provisions Slack /
              # PagerDuty secrets as SecureString parameters when the user
              # saves a config in the console. Scoped to the same
              # Namespace/Stage prefix as the Notify Lambda's read side
              # (see NotifyRole above) so alerts stay isolated per stack.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/polyris/alerts/${Namespace}/${Stage}/*"
              # On-demand Glue schema sync — used by GET /api/assets/{name}/glue-schema.
              # Read-only Catalog access; called only when a user opens an asset detail page.
              - Effect: Allow
                Action:
                  - glue:GetTable
                Resource: "*"
              # Invoke the notify Lambda to send a test alert (ADR #103 follow-up C), and the
              # reconciler, which resume asks to check a run's waiting tasks (ADR #130 §6.5).
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt NotifyFunction.Arn
                  - !GetAtt ReconcileFunction.Arn

  # ---------------------------------------------------------------------------
  # API Gateway (HTTP API)
  # ---------------------------------------------------------------------------

  ConsoleApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - "*"
      # Auth: Cognito JWT authorizer - configured post-deploy if EnableCognitoAuth=true
      # For SAM HttpApi, auth is attached per-route or via DefinitionBody
      # Console API Lambda handles auth validation internally when COGNITO vars are set

  # ---------------------------------------------------------------------------
  # Cognito (optional)
  # ---------------------------------------------------------------------------

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Condition: EnableCognitoAuthCondition
    Properties:
      UserPoolName: !Sub "${Namespace}-${Stage}-polyris-console"
      # No self sign-up: every Cognito user gets full console access
      # (console_api auth.py), so only an admin may create users — the
      # AdminEmail user, the AWS console, or `aws cognito-idp admin-create-user`.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      MfaConfiguration: "OFF"
      UserPoolTags:
        Environment: polyris
        Stage: !Ref Stage
        Namespace: !Ref Namespace

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: EnableCognitoAuthCondition
    Properties:
      ClientName: !Sub "${Namespace}-${Stage}-polyris-console-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      CallbackURLs:
        - http://localhost:3000
        - http://localhost:5173
        - !Sub "https://${ConsoleUiDistribution.DomainName}"
        - !If [HasConsoleUrlOverride, !Ref ConsoleUrlOverride, !Ref "AWS::NoValue"]
      LogoutURLs:
        - http://localhost:3000
        - http://localhost:5173
        - !Sub "https://${ConsoleUiDistribution.DomainName}"
        - !If [HasConsoleUrlOverride, !Ref ConsoleUrlOverride, !Ref "AWS::NoValue"]
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days

  # First console admin (ADR #131). Cognito sends the invitation email with a
  # temporary password; the user sets a permanent one on first login.
  CognitoAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: CreateAdminUserCondition
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: "true"

  # ---------------------------------------------------------------------------
  # EventBridge — Slack connection
  # ---------------------------------------------------------------------------



  TestSuccessSfn:
    Type: AWS::StepFunctions::StateMachine
    DependsOn: OrchestrationRolePolicy
    Properties:
      StateMachineName: !Sub "${Namespace}-${Stage}-polyris-test-success"
      StateMachineType: STANDARD
      RoleArn: !GetAtt OrchestrationRole.Arn
      LoggingConfiguration:
        Level: !Ref SfnExpressLogLevel
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt TestSfnLogGroup.Arn
      Definition:
        Comment: Test SFN - waits 20 seconds then succeeds
        QueryLanguage: JSONata
        StartAt: Wait20Seconds
        States:
          Wait20Seconds:
            Type: Wait
            Seconds: 20
            Next: Success
          Success:
            Type: Succeed
            Output:
              status: completed
              message: Test task finished successfully

  TestFailureSfn:
    Type: AWS::StepFunctions::StateMachine
    DependsOn: OrchestrationRolePolicy
    Properties:
      StateMachineName: !Sub "${Namespace}-${Stage}-polyris-test-failure"
      StateMachineType: STANDARD
      RoleArn: !GetAtt OrchestrationRole.Arn
      LoggingConfiguration:
        Level: !Ref SfnExpressLogLevel
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt TestSfnLogGroup.Arn
      Definition:
        Comment: Test SFN - waits 20 seconds then fails
        StartAt: Wait20Seconds
        States:
          Wait20Seconds:
            Type: Wait
            Seconds: 20
            Next: FailState
          FailState:
            Type: Fail
            Error: TestError
            Cause: This is a deliberate test failure to verify error handling

  TestQuickSfn:
    Type: AWS::StepFunctions::StateMachine
    DependsOn: OrchestrationRolePolicy
    Properties:
      StateMachineName: !Sub "${Namespace}-${Stage}-polyris-test-quick"
      StateMachineType: STANDARD
      RoleArn: !GetAtt OrchestrationRole.Arn
      LoggingConfiguration:
        Level: !Ref SfnExpressLogLevel
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt TestSfnLogGroup.Arn
      Definition:
        Comment: Test SFN - quick 5 second wait
        QueryLanguage: JSONata
        StartAt: Wait5Seconds
        States:
          Wait5Seconds:
            Type: Wait
            Seconds: 5
            Next: Success
          Success:
            Type: Succeed
            Output:
              status: completed
              message: Quick test finished
              data:
                value: 42

