  # ---------------------------------------------------------------------------
  # Console UI — S3 + CloudFront (static export)
  # ---------------------------------------------------------------------------

  ConsoleUiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Namespace}-${Stage}-polyris-console-ui"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace

  ConsoleUiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsoleUiBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ConsoleUiBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ConsoleUiDistribution}"

  ConsoleUiOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Namespace}-${Stage}-polyris-console-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------------------------------------------------------------------
  # CloudFront Function — SPA URL rewrite (ADR #41)
  # ---------------------------------------------------------------------------
  # Rewrites requests for path-based SPA routes (e.g. /pipelines/etl_main,
  # /assets/retail/orders) to the corresponding pre-rendered index.html so
  # S3 finds the file and CloudFront does not fall back to root /index.html.
  # Without this, deep URLs returned root and the SPA boot loop'd.
  #
  # Logic: match /pipelines, /pipelines/, /pipelines/anything-without-extension
  # (same for /assets, /tasks, /runs) → rewrite to /{view}/index.html.
  # Anything with an extension (.html, .js, .css, etc.) or under /_next/ is
  # passed through unchanged so static assets keep working.

  ConsoleUiUrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${Namespace}-${Stage}-polyris-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Runtime: cloudfront-js-2.0
        Comment: SPA URL rewrite for Polyris path-based routing
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          // Match /pipelines, /assets, /tasks, /runs, /backfills (with or
          // without trailing path). Only when the path has no file
          // extension — assets keep flowing through.
          //
          // ⚠️ Every top-level view registered in App.tsx mainView MUST
          // be listed here, OR the route will 404 → CustomErrorResponse
          // → /index.html → RootPage redirect to /pipelines/ (user sees
          // "click X tab, get redirected to Pipelines"). Keep this in
          // sync with ui/src/types/index.ts MAIN_VIEWS and ui/src/app/
          // page.tsx validViews.
          var match = uri.match(/^\/(pipelines|assets|tasks|runs|backfills)(\/[^.]*)?$/);
          if (match) {
            req.uri = '/' + match[1] + '/index.html';
          }
          return req;
        }

  # ---------------------------------------------------------------------------
  # CloudFront response headers — security headers (ADR #96)
  # ---------------------------------------------------------------------------
  # next.config.mjs used to declare these via headers(), but `output: 'export'`
  # has no Next.js server to apply them — they never reached the browser. They
  # are applied here at the edge, on every response of the default cache
  # behavior. X-XSS-Protection is intentionally omitted (deprecated, ignored by
  # modern browsers, and can itself introduce issues — OWASP recommends against
  # it). Cache-Control stays on the S3 objects (deploy-ui.sh), not here, so HTML
  # and hashed assets keep their distinct policies.
  ConsoleUiResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${Namespace}-${Stage}-polyris-security-headers"
        Comment: Security headers for Polyris Console (ADR #96)
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true

  ConsoleUiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub "Polyris Console UI - ${Namespace} ${Stage}"
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt ConsoleUiBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt ConsoleUiOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: !Ref ConsoleUiResponseHeadersPolicy
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ConsoleUiUrlRewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # SPA fallback for any other 404 (e.g. genuinely missing path).
          # SPA routes themselves are rewritten by the Function above, so this
          # only fires for paths that don't match our route prefixes.
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100
      Tags:
        - Key: Environment
          Value: polyris
        - Key: Stage
          Value: !Ref Stage
        - Key: Namespace
          Value: !Ref Namespace


  # ---------------------------------------------------------------------------
  # UI Bootstrap — Custom Resource (prebuilt UI only, ADR #131)
  # Copies the prebuilt UI from ArtifactsBucket/UiArtifactsPrefix into
  # ConsoleUiBucket, deletes files the new build no longer has, writes
  # config.js from this stack's values, and invalidates CloudFront.
  # Because config.js is rendered here, it always matches the stack — even
  # when the stack is updated outside polyris-up.
  # ---------------------------------------------------------------------------

  UiBootstrapRole:
    Type: AWS::IAM::Role
    Condition: HasUiArtifacts
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-ui-bootstrap-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UiBootstrapPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  # Whole bucket, not just this release's prefix: the prefix
                  # changes on every upgrade, and a policy scoped to it would
                  # race IAM propagation (and break UiBootstrap on rollback).
                  - !Sub "arn:aws:s3:::${ArtifactsBucket}"
                  - !Sub "arn:aws:s3:::${ArtifactsBucket}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ConsoleUiBucket.Arn
                  - !Sub "${ConsoleUiBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ConsoleUiDistribution}"
              # Delete events: read the parent stack's status to tell a real
              # teardown (empty the bucket) from a resource removal during an
              # update (leave the bucket alone).
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId

  # Declared so it is deleted with the stack; Lambda would otherwise create
  # /aws/lambda/<name> itself, and polyris-down would leave it behind
  # (found in the ADR #131 live smoke).
  UiBootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasUiArtifacts
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Namespace}-${Stage}-polyris-ui-bootstrap"
      RetentionInDays: !Ref LogRetentionDays

  UiBootstrapFunction:
    Type: AWS::Serverless::Function
    Condition: HasUiArtifacts
    Properties:
      FunctionName: !Sub "${Namespace}-${Stage}-polyris-ui-bootstrap"
      CodeUri: lambdas/ui_bootstrap/
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt UiBootstrapRole.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref UiBootstrapLogGroup
      Tags:
        Environment: polyris
        Stage: !Ref Stage
        Namespace: !Ref Namespace

  UiBootstrap:
    Type: AWS::CloudFormation::CustomResource
    Condition: HasUiArtifacts
    Properties:
      ServiceToken: !GetAtt UiBootstrapFunction.Arn
      DestBucket: !Ref ConsoleUiBucket
      SourceBucket: !Ref ArtifactsBucket
      SourcePrefix: !Ref UiArtifactsPrefix
      # Same value ui/deploy.sh writes: the ConsoleApiUrl output + "/api".
      ApiUrl: !Sub "https://${ConsoleApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api"
      CognitoUserPoolId: !If [EnableCognitoAuthCondition, !Ref CognitoUserPool, ""]
      CognitoClientId: !If [EnableCognitoAuthCondition, !Ref CognitoUserPoolClient, ""]
      Region: !Ref AWS::Region
      DistributionId: !Ref ConsoleUiDistribution

  # ---------------------------------------------------------------------------
  # Bucket Cleanup — empties ConsoleUiBucket + ResultsBucket on stack delete
  # so `sam delete` doesn't fail on non-empty buckets. Gated by the
  # AutoEmptyBucketsOnDelete parameter (default false) — enabling this
  # trades safety for `sam delete just works`. See parameter description
  # above for the warning.
  # ---------------------------------------------------------------------------

  BucketCleanupRole:
    Type: AWS::IAM::Role
    Condition: AutoEmptyBucketsCondition
    Properties:
      RoleName: !Sub "${Namespace}-${Stage}-polyris-bucket-cleanup-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EmptyBuckets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ConsoleUiBucket.Arn
                  - !GetAtt ResultsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub "${ConsoleUiBucket.Arn}/*"
                  - !Sub "${ResultsBucket.Arn}/*"
              # DescribeStacks is how the Lambda tells "sam delete" (empty
              # the buckets) apart from "sam deploy that toggled the flag
              # off" (must NOT empty). See sam/lambdas/bucket_cleanup/index.py.
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: "*"

  BucketCleanupFunction:
    Type: AWS::Serverless::Function
    Condition: AutoEmptyBucketsCondition
    Properties:
      FunctionName: !Sub "${Namespace}-${Stage}-polyris-bucket-cleanup"
      CodeUri: lambdas/bucket_cleanup/
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt BucketCleanupRole.Arn
      Tags:
        Environment: polyris
        Stage: !Ref Stage
        Namespace: !Ref Namespace

  BucketCleanup:
    # References both buckets so CloudFormation puts this resource *after*
    # them in the create order and *before* them in the delete order — the
    # Delete event on this resource fires before the buckets themselves are
    # removed, which is exactly the ordering we need.
    Type: AWS::CloudFormation::CustomResource
    Condition: AutoEmptyBucketsCondition
    Properties:
      ServiceToken: !GetAtt BucketCleanupFunction.Arn
      Buckets:
        - !Ref ConsoleUiBucket
        - !Ref ResultsBucket

  # Managed policy that user task roles (Lambda/ECS/Glue/Batch) attach so their
  # code can call xcom.pull() — least-privilege read of the output store and the
  # results bucket. Polyris references user-owned compute by name/ARN and does not
  # own those roles, so it publishes this policy for users to attach themselves.
  PolyrisTaskReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Namespace}-${Stage}-polyris-task-read"
      Description: >-
        Read access to the Polyris output store and results bucket. Attach to the
        execution role of any Lambda/ECS/Glue/Batch task that calls xcom.pull().
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PolyrisOutputStoreRead
            Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource:
              - !GetAtt PipelineTokensTable.Arn
          # Deferred-for-removal — kept because deleting it triggers a
          # replacement of the whole managed policy (CFN treats Description
          # changes as replacement, and the fixed ManagedPolicyName above +
          # downstream `!ImportValue` block the delete-then-create). See
          # CHANGELOG "Deferred (planned removal, blocked by CFN)" for the
          # two-phase cleanup plan. Do not treat this as load-bearing —
          # ResultsBucket is polyris-deploy's CFN artifact bucket, not an
          # XCom store; user tasks never wrote there.
          - Sid: PolyrisResultsBucketRead
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub "${ResultsBucket.Arn}/*"

  # Managed policy for service tasks (Glue/ECS/Batch) that call xcom.push()
  # in their job code. Lambda return values do NOT need this policy — the
  # wrapper captures Lambda output directly. EMR xcom.push() is unsupported
  # in 1.0.0 (see CHANGELOG "Known limitations" — HadoopJarStep.Args risks
  # breaking arbitrary Spark arg parsers, so POLYRIS_* env injection is not
  # attempted for the EMR branch; attaching this policy to an EMR task role
  # would grant permission but xcom.push() would still fail at runtime).
  # See the IAM attachment matrix in docs/features/DATA_PASSING.md.
  #
  # The IAM Condition restricts UpdateItem to keys with `output#*` prefix —
  # user tasks can only touch the canonical output store, never the internal
  # `_pause_*` / `_notify_warn_*` records or the new `input#*` task_input
  # records (those are wrapper-owned). Least privilege within the polyris
  # trust boundary (same AWS account as the pipeline-tokens table).
  PolyrisTaskWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Namespace}-${Stage}-polyris-task-write"
      Description: >-
        Write access to the Polyris output store for tasks that call
        xcom.push(). Attach to Glue/ECS/Batch/EMR task roles alongside
        PolyrisTaskReadPolicy. Lambda return values do NOT need this.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PolyrisOutputStoreWrite
            Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt PipelineTokensTable.Arn
            Condition:
              "ForAllValues:StringLike":
                "dynamodb:LeadingKeys":
                  - "output#*"


# =============================================================================
# Outputs
# =============================================================================
Outputs:

  PolyrisTaskReadPolicyArn:
    Description: Attach this managed policy to any task role that calls xcom.pull()
    Value: !Ref PolyrisTaskReadPolicy
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-task-read-policy"

  PolyrisTaskWritePolicyArn:
    Description: Attach this managed policy to Glue/ECS/Batch task roles that call xcom.push() (EMR unsupported in 1.0.0)
    Value: !Ref PolyrisTaskWritePolicy
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-task-write-policy"

  ConsoleApiUrl:
    Description: API Gateway URL for Console UI
    Value: !Sub "https://${ConsoleApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-console-api-url"

  DependencyWrapperArn:
    Description: ARN of the dependency wrapper Step Function
    Value: !Ref DependencyWrapperSfn
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-wrapper-arn"

  OrchestrationRoleArn:
    Description: ARN of the orchestration IAM role
    Value: !GetAtt OrchestrationRole.Arn
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-orchestration-role-arn"

  PipelineRegistryTable:
    Description: DynamoDB pipeline registry table name
    Value: !Ref PipelineRegistryTable
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-pipeline-registry-table"

  PipelineTokensTable:
    Description: DynamoDB pipeline tokens table name
    Value: !Ref PipelineTokensTable
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-pipeline-tokens-table"

  AssetSubscriptionsTable:
    Description: DynamoDB asset subscriptions table name
    Value: !Ref AssetSubscriptionsTable
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-asset-subscriptions-table"

  ResultsBucket:
    Description: S3 bucket for task results
    Value: !Ref ResultsBucket
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-results-bucket"

  CognitoUserPoolId:
    Condition: EnableCognitoAuthCondition
    Description: Cognito User Pool ID for Console UI auth
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-cognito-pool-id"

  CognitoClientId:
    Condition: EnableCognitoAuthCondition
    Description: Cognito App Client ID for Console UI auth
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-cognito-client-id"

  TestQuickSfnArn:
    Description: ARN of test-quick Step Function (for demo pipelines)
    Value: !Ref TestQuickSfn
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-test-quick-arn"

  TestFailureSfnArn:
    Description: ARN of test-failure Step Function (for demo pipelines)
    Value: !Ref TestFailureSfn
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-test-failure-arn"

  ConsoleUiUrl:
    Description: CloudFront URL for the Polyris Console UI
    Value: !Sub "https://${ConsoleUiDistribution.DomainName}"
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-console-url"

  ConsoleUiBucket:
    Description: S3 bucket for Console UI static files
    Value: !Ref ConsoleUiBucket
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-console-ui-bucket"

  ConsoleUiDistributionId:
    Description: CloudFront distribution ID (needed for cache invalidation)
    Value: !Ref ConsoleUiDistribution
    Export:
      Name: !Sub "${Namespace}-${Stage}-polyris-console-distribution-id"